        "409":
          description: Email address is already registered
          schema:
            $ref: '#/definitions/github_com_ORG_PLACEHOLDER_EnterpriseRag_internal_errors.AppError'
        "410":
          description: Link is invalid or has been revoked
          schema:
            $ref: '#/definitions/github_com_ORG_PLACEHOLDER_EnterpriseRag_internal_errors.AppError'
      summary: Register using a shared link
