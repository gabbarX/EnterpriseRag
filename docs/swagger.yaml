  internal_handler.RuntimeWorkerPool:
    description: Return every row in the system_settings table (system-scope, not
      workspace-scoped). SystemAdmin only.
    properties:
      active:
        description: live workers assigned to this pool
        type: integer
      cluster_capacity:
        description: sum of live server concurrency
        type: integer
      concurrency:
        description: configured per instance
        type: integer
      instances:
        description: live asynq server heartbeats
        type: integer
      name:
        type: string
      queue_count:
        type: integer
      utilization:
        description: Active / ClusterCapacity
        type: number
    type: object
  internal_handler.SandboxCheckItem:
    properties:
      latency_ms:
        type: integer
      message:
        description: Message carries free-form provider detail for an executed probe.
        type: string
      name:
        type: string
      ok:
        type: boolean
      reason:
        description: |-
          Reason is a stable code explaining why a probe was skipped. It exists so
          the UI can phrase the skip in the operator's language instead of echoing
          a server-side sentence.
        type: string
    type: object
  internal_handler.SandboxCheckRequest:
    properties:
      config:
        $ref: '#/definitions/types.TenantSandboxConfig'
      config_id:
        description: |-
          ConfigID lets an edit form test stored credentials while overriding only
          the fields the admin changed in the drawer.
        type: string
      deep:
        description: |-
          Deep additionally runs a throwaway script. For remote backends this also
          creates and destroys one sandbox, which is the only way to validate the
          template ID, data plane, in-sandbox execution, and outbound egress. It may
          consume real sandbox time, so it is opt-in.
        type: boolean
    type: object
  internal_handler.SandboxCheckResponse:
    properties:
      capabilities:
        additionalProperties:
          type: boolean
        type: object
      checks:
        items:
          $ref: '#/definitions/internal_handler.SandboxCheckItem'
        type: array
      ok:
        type: boolean
      provider:
        type: string
    type: object
