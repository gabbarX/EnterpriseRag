      max_chars:
        type: integer
      min_chars:
        type: integer
      stddev_chars:
        type: integer
      truncated_to:
        description: |-
          TruncatedTo, when set, is the original chunk count before the
          response was truncated to previewMaxChunks for transport.
        type: integer
    type: object
  internal_handler.PromoteUserToSystemAdminRequest:
    properties:
      email:
        type: string
      user_id:
        type: string
    type: object
  internal_handler.RemoteModelCheckRequest:
    properties:
      apiKey:
        type: string
      appSecret:
        description: AppSecret covers rerank providers that sign requests with a second
