  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Change the login password of the current user. The new password
        must be 8-32 characters and contain both letters and digits; when strong passwords
        are enabled it must also contain upper and lower case letters and a special
        character. On success all sessions are revoked and the user must log in again.
      parameters:
      - description: Password change request
        in: body
        name: request
        required: true
        schema:
          properties:
            new_password:
              type: string
            old_password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Changed successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: Change password
      tags:
      - Authentication
  /auth/config:
    get:
      consumes:
      - application/json
      description: Returns the registration mode and password complexity switch of
        the current deployment, so the frontend can decide whether to show the registration
        entry point and which password rules to apply
