          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: List my artifacts
      tags:
      - Sessions
  /auth/auto-setup:
    post:
      consumes:
      - application/json
      description: 'Lite edition only: creates a default user and space on first start
        and returns a token. Both the first and subsequent starts must pass desktop
