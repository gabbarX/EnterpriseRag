    get:
      description: |-
        Unlike /auth/oidc/url, this endpoint issues a direct 302 redirect to the authorisation page of the OIDC provider,
        with no frontend JavaScript involved. It suits external platforms (such as a corporate portal) that only need to publish a link
        to trigger the OIDC authorisation code flow, relying on the SSO session of the IdP to avoid re-entering a password.
      responses:
        "302":
          description: Found
      summary: Start OIDC login (direct 302)
      tags:
      - Authentication
  /auth/oidc/url:
    get:
      consumes:
