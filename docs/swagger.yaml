        Returns the invitation context (space name / role / expiry) for the token in an invitation link,
        for display on the registration page. No authentication; returns 410 when the token is invalid or revoked.
        Uses POST with a body instead of GET with a path parameter so the token does not end up in access logs, browser history or tracing.
      parameters:
      - description: Invitation token
        in: body
