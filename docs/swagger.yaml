  /auth/switch-tenant:
    post:
      consumes:
      - application/json
      description: |-
        Reissues an access token for the current user in the target space; the user must have an active membership in that space (except for cross-tenant superusers).
        A successful switch records the target space as the most recently active tenant preference, so the next login and refresh both land in that space (the refresh JWT carries no tenant_id).
        This preference is account level: one switch changes where the next login or refresh lands on every device of that user. If the preference cannot be written the whole switch fails and no new token is issued.
      parameters:
      - description: Switch request
        in: body
        name: request
        required: true
        schema:
          properties:
            refresh_token:
              type: string
            tenant_id:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.LoginResponse'
        "400":
          description: Invalid parameters
          schema:
            $ref: '#/definitions/errors.AppError'
        "403":
          description: No membership in that space, or the preference could not be
            written
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: Switch the active space
      tags:
      - Authentication
