        type: string
      baseUrl:
        type: string
      customHeaders:
        additionalProperties:
          type: string
        type: object
      dimension:
        type: integer
      extraConfig:
        additionalProperties:
          type: string
        type: object
      interfaceType:
        type: string
      modelId:
        description: |-
          ModelID, when set, instructs the handler to substitute any missing
