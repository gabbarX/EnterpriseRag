      uptime_seconds:
        description: UptimeSeconds is seconds elapsed since process start.
        type: integer
      vector_store_engine:
        type: string
      version:
        type: string
    type: object
  internal_handler.InitializationRequest:
    properties:
      documentSplitting:
        properties:
          chunkOverlap:
            minimum: 0
            type: integer
          chunkSize:
            maximum: 10000
            minimum: 100
            type: integer
          separators:
            items:
              type: string
            minItems: 1
            type: array
        required:
        - chunkSize
        - separators
        type: object
      embedding:
        properties:
          apiKey:
            type: string
          baseUrl:
            type: string
          dimension:
            type: integer
          modelName:
            type: string
          source:
            type: string
        required:
        - modelName
        - source
        type: object
      llm:
        properties:
          apiKey:
            type: string
          baseUrl:
            type: string
          modelName:
            type: string
          source:
            type: string
        required:
        - modelName
        - source
        type: object
      multimodal:
        properties:
          enabled:
            type: boolean
          minio:
            properties:
              bucketName:
                type: string
              pathPrefix:
                type: string
            type: object
          storageType:
            type: string
          vlm:
            properties:
              apiKey:
                type: string
              baseUrl:
                type: string
              interfaceType:
                description: '"ollama" or "openai"'
                type: string
              modelName:
                type: string
            type: object
        type: object
      nodeExtract:
        properties:
          enabled:
            type: boolean
          nodes:
            items:
              properties:
                attributes:
                  items:
                    type: string
                  type: array
                name:
                  type: string
              type: object
            type: array
          relations:
            items:
              properties:
                node1:
                  type: string
                node2:
                  type: string
                type:
                  type: string
              type: object
            type: array
          tags:
            items:
              type: string
            type: array
          text:
            type: string
        type: object
      questionGeneration:
        properties:
          enabled:
            type: boolean
          questionCount:
            type: integer
        type: object
      rerank:
        properties:
          apiKey:
            type: string
          baseUrl:
            type: string
          enabled:
            type: boolean
          modelName:
            type: string
        type: object
    required:
    - documentSplitting
    - embedding
    - llm
    type: object
  internal_handler.KBModelConfigRequest:
    properties:
      asr_config:
        $ref: '#/definitions/types.ASRConfig'
      documentSplitting:
        description: Document chunking configuration.
        properties:
          childChunkSize:
            type: integer
          chunkOverlap:
            type: integer
          chunkSize:
            type: integer
          enableParentChild:
            type: boolean
          languages:
            items:
              type: string
            type: array
          parentChunkSize:
            type: integer
          parserEngineRules:
            items:
              $ref: '#/definitions/types.ParserEngineRule'
            type: array
          separators:
            items:
              type: string
            type: array
          strategy:
            description: |-
              Strategy / TokenLimit / Languages use pointer types so the
              handler can distinguish "field absent in payload" (no change)
              from "field present with empty/zero value" (clear / disable).
              Without that distinction, users could set strategy="auto" once
              but never reset it back to legacy / unset.
            type: string
          tableMetadataInstructions:
            type: string
          tokenLimit:
            type: integer
        type: object
      embeddingModelId:
        description: optional when RAG indexing is disabled
        type: string
      llmModelId:
        type: string
      multimodal:
        description: Multimodal configuration (model related only; the storage engine
          is configured in storageProvider).
        properties:
          enabled:
            type: boolean
        type: object
      nodeExtract:
        description: Knowledge graph configuration.
        properties:
          customInstructions:
            type: string
          enabled:
            type: boolean
          nodes:
            items:
              $ref: '#/definitions/types.GraphNode'
            type: array
          relations:
            items:
              $ref: '#/definitions/types.GraphRelation'
            type: array
          tags:
            items:
              type: string
            type: array
          text:
            type: string
        type: object
      questionGeneration:
        description: Question generation configuration.
        properties:
          customInstructions:
            type: string
          enabled:
            type: boolean
          questionCount:
            type: integer
        type: object
      storageBackendId:
        type: string
      storageProvider:
        description: Storage engine selection ("local" | "minio" | "s3"); affects
          document uploads and images inside documents. The parameters are read from
          the global settings.
        type: string
      vlm_config:
        $ref: '#/definitions/types.VLMConfig'
    required:
    - llmModelId
    type: object
  internal_handler.ListSystemAdminsResponse:
    properties:
      admins:
        items:
          $ref: '#/definitions/types.UserInfo'
        type: array
      total:
        type: integer
    type: object
  internal_handler.ModelTestRequest:
    properties:
      apiKey:
        type: string
      appSecret:
        description: AppSecret covers rerank providers that sign requests with a second
          secret (maps to model Parameters.AppSecret).
        type: string
      baseUrl:
        type: string
      customHeaders:
        additionalProperties:
          type: string
        type: object
      dimension:
        type: integer
      extraConfig:
        additionalProperties:
          type: string
        type: object
      interfaceType:
        type: string
      modelId:
        description: |-
          ModelID, when set, instructs the handler to substitute any missing
          secrets (APIKey, AppSecret via ExtraConfig) from the stored model
          record before assembling the test client. This lets the "Test
          connection" button work on existing models without making the
          frontend reload — and ship — the plaintext API key. Other fields
          (BaseURL, ModelName, etc.) on this request still override the
          stored values, so a user can validate a new endpoint against the
          existing credentials in one click.
        type: string
      modelName:
        type: string
      provider:
        type: string
      source:
        description: defaults to "remote" when empty
        type: string
      supportsDimensionOverride:
        type: boolean
    required:
    - modelName
    type: object
  internal_handler.MoveKnowledgeRequest:
    properties:
      knowledge_ids:
        items:
          type: string
        minItems: 1
        type: array
      mode:
