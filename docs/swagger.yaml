  types.AgentStep:
    properties:
      intermediate_answer:
        description: |-
          IntermediateAnswer preserves a plain answer followed by a loop-end steer.
          The canonical final answer is still stored in Message.Content.
        type: boolean
      iteration:
        description: Iteration number (0-indexed)
        type: integer
      reasoning_content:
        description: |-
          ReasoningContent stores the OpenAI-protocol reasoning_content emitted by the
          model in this round. Persisted on AgentStep so cross-turn replay can put it
          back on the assistant message — required by some providers' thinking
          mode, ignored by providers that don't recognize the field.
        type: string
      reasoning_metadata:
        $ref: '#/definitions/types.ProviderMetadata'
      reasoning_signature:
        description: |-
          ReasoningSignature / ReasoningMetadata are the provider artifacts that
          must accompany ReasoningContent on replay (Anthropic signatures,
          OpenAI Responses encrypted reasoning items).
        type: string
      thought:
        description: LLM's reasoning/thinking (Think phase)
        type: string
      timestamp:
        description: When this step occurred
        type: string
      tool_calls:
        description: Tools called in this step (Act phase)
        items:
          $ref: '#/definitions/types.ToolCall'
        type: array
      truncated:
        description: |-
          Truncated marks the round the completion-token cap cut off. It rides in
          the agent_steps JSON so a reloaded, shared or re-opened conversation can
          still show that the answer stops mid-sentence by design, rather than
          looking finished. Live streaming carries the same fact on the answer
          event; this is what survives the round trip.
        type: boolean
      user_messages_before:
        description: |-
          UserMessagesBefore records consumed steer rows in delivery order, before
          this model response. Unlike timestamps, this remains unambiguous on replay.
        items:
          type: string
        type: array
    type: object
  types.AuditLog:
    properties:
      action:
        type: string
      actor_role:
        type: string
      actor_user_id:
        type: string
      created_at:
        type: string
      details:
        items:
          type: integer
        type: array
      id:
        type: integer
      outcome:
        type: string
      request_method:
        type: string
      request_path:
        type: string
      scope_id:
        type: string
      scope_type:
        type: string
      target_id:
        type: string
      target_type:
        type: string
      target_user_id:
        type: string
      tenant_id:
        type: integer
    type: object
  types.AutoTagConfig:
    properties:
      enabled:
        type: boolean
      max_tags:
        type: integer
      model_id:
        type: string
      skip_if_tagged:
        description: |-
          SkipIfTagged leaves documents that already carry tags untouched, so a
          deliberate manual classification is not diluted by model guesses. It is
          a pointer because the default is true: rows written before this field
          existed decode to nil and must not silently flip to "always append".
        type: boolean
    type: object
  types.ChatHistoryConfig:
    properties:
      embedding_model_id:
        description: |-
          EmbeddingModelID is the ID of the embedding model used for vectorizing chat messages.
          Once messages have been indexed, the model cannot be changed (requires re-indexing).
        type: string
      enabled:
        description: Enabled controls whether chat history indexing is active
        type: boolean
      knowledge_base_id:
        description: |-
          KnowledgeBaseID is the auto-managed hidden knowledge base for chat history.
          This is set internally when the feature is first enabled; users should not set this directly.
        type: string
    type: object
  types.ChunkingConfig:
    properties:
      child_chunk_size:
        description: |-
          ChildChunkSize is the size of child chunks used for embedding (default: 384).
          Only used when EnableParentChild is true.
        type: integer
      chunk_overlap:
        description: Chunk overlap
        type: integer
      chunk_size:
        description: Chunk size
        type: integer
      enable_parent_child:
        description: |-
          EnableParentChild enables two-level parent-child chunking strategy.
          When enabled, large parent chunks provide context while small child chunks
          are used for vector matching. Retrieval matches on child but returns parent content.
        type: boolean
      languages:
        description: |-
          Languages hints the heuristic patterns. Empty = auto-detect from content.
          Examples: ["de"], ["en", "zh"].
        items:
          type: string
        type: array
      parent_chunk_size:
        description: |-
          ParentChunkSize is the size of parent chunks (default: 4096).
          Only used when EnableParentChild is true.
        type: integer
      parser_engine_rules:
        description: |-
          ParserEngineRules configures which parser engine to use for each file type.
          When empty, DefaultParserEngine is used (builtin/simple routing, except
          types that only a specific engine can parse: ppt/pptx fall back to
          markitdown). A linked anydoc binding is preferred for every type it
          converts.
        items:
          $ref: '#/definitions/types.ParserEngineRule'
        type: array
      separators:
        description: Separators
        items:
          type: string
        type: array
      strategy:
        description: |-
          Strategy selects the adaptive chunking tier. Empty / "legacy" preserves
          the historical recursive splitter; "auto" lets a profiler pick between
          heading-aware, heuristic and recursive tiers; "heading" / "heuristic" /
          "recursive" pin the tier explicitly.
        type: string
      table_metadata_instructions:
        description: |-
          TableMetadataInstructions contains optional business guidance used when
          generating searchable summaries for CSV/Excel tables. The system-owned
          output contract remains fixed; these instructions only add domain context.
        type: string
      token_limit:
        description: |-
          TokenLimit caps chunk size in approximate tokens. 0 = use ChunkSize
          as a character count.
        type: integer
    type: object
  types.ConnectionConfig:
    properties:
      addr:
        description: Common
        type: string
      api_key:
        description: AES-GCM encrypted
        type: string
      database:
        description: |-
          Database name used by engines that support database-level namespaces
          (currently Milvus).
        type: string
      grpc_address:
        description: Weaviate
        type: string
      host:
        description: Qdrant
        type: string
      http_port:
        description: |-
          Legacy: a separate HTTP port for engines whose ingest API did not share the
          main address. No currently supported engine reads it; retained so existing
          stored configurations round-trip unchanged.
        type: integer
      insecure_skip_verify:
        description: |-
          InsecureSkipVerify disables TLS certificate verification when
          talking to the backing store over HTTPS. Defaults to false
          (secure). Set to true ONLY for self-signed development clusters;
          production deployments should provide trusted certificates via
          the system CA pool. Cross-driver applicable but currently only
          the OpenSearch driver (Phase 3) reads this field. Note: this
          differs from the Qdrant-specific UseTLS below, which *enables*
          TLS on gRPC connections — InsecureSkipVerify only controls
          *verification* of an already-TLS connection.
        type: boolean
      password:
        description: AES-GCM encrypted
        type: string
      port:
        type: integer
      scheme:
        type: string
      use_default_connection:
        description: Postgres
        type: boolean
      use_tls:
        type: boolean
      username:
        type: string
      version:
        description: |-
          Version is the detected server version (e.g., "7.10.1", "16.2", "1.12.6").
          Auto-populated by TestConnection on successful connectivity check.
        type: string
    type: object
  types.ContextConfig:
    properties:
      compression_strategy:
        description: 'Compression strategy: "sliding_window" or "smart"'
        type: string
      max_tokens:
        description: Maximum tokens allowed in LLM context
        type: integer
      recent_message_count:
        description: |-
          For sliding_window: number of messages to keep
          For smart: number of recent messages to keep uncompressed
        type: integer
      summarize_threshold:
        description: 'Summarize threshold: number of messages before summarization'
        type: integer
    type: object
