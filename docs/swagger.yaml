        schema:
          $ref: '#/definitions/internal_handler.storageBackendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Connectivity test result (success, error)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/github_com_ORG_PLACEHOLDER_EnterpriseRag_internal_errors.AppError'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Test storage backend with raw config
      tags:
      - StorageBackend
  /storage-backends/types:
    get:
      description: Return the storage provider types allowed by STORAGE_ALLOW_LIST
        for UI form generation (local, minio, s3).
      produces:
      - application/json
      responses:
        "200":
          description: List of allowed storage provider types
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: List allowed storage provider types
      tags:
      - StorageBackend
  /system/admin/api-keys:
    get:
      description: Lists non-workspace API keys. Full tokens are always masked. Human
        SystemAdmin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: List platform API keys
      tags:
      - System Admin
    post:
      consumes:
      - application/json
      description: Creates a capability-scoped key that may target any workspace through
        X-Tenant-ID. The plaintext token is returned once. Human SystemAdmin only.
      parameters:
      - description: Platform API key
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.platformAPIKeyCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Create a platform API key
      tags:
      - System Admin
  /system/admin/api-keys/{key_id}:
    delete:
      description: Immediately revokes a platform API key. Human SystemAdmin only.
      parameters:
      - description: API key ID
        in: path
        name: key_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Revoke a platform API key
      tags:
      - System Admin
  /system/admin/audit-log:
    get:
      description: Returns system-scope (tenant_id=0) audit events, covering SystemAdmin
        operations such as system.setting_changed / system.admin_promoted / system.admin_revoked.
        Cursor pagination in descending id order.
      parameters:
      - description: 'Cursor: return records with id less than this value (defaults
          to the latest)'
        in: query
        name: after_id
        type: integer
      - description: Page size, 1-100, default 50
        in: query
        name: limit
        type: integer
      - description: Exact filter on action (for example system.setting_changed)
        in: query
        name: action
        type: string
      - description: Exact filter on outcome (success / denied)
        in: query
        name: outcome
        type: string
      - description: Exact filter on actor_user_id
        in: query
        name: actor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.auditLogListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get platform audit logs
      tags:
      - Audit Logs
  /system/admin/list:
    get:
      description: |-
        Retrieve a paginated list of users with system administrator
        privileges (SystemAdmin only). Supports `offset` (default 0)
        and `limit` (default 50, max 200) query parameters. Walks the
        partial-friendly idx_users_is_system_admin index.
      parameters:
      - default: 0
        description: Page offset
        in: query
        name: offset
        type: integer
      - default: 50
        description: Page size (max 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: System admins retrieved successfully
          schema:
            $ref: '#/definitions/internal_handler.ListSystemAdminsResponse'
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
      summary: List all system administrators
      tags:
      - System Admin
  /system/admin/promote:
    post:
      consumes:
      - application/json
      description: |-
        Grant system administrator privileges to a user (SystemAdmin only).
        Idempotent: re-promoting an existing system admin returns 200 with no DB write.
        Identify the user by email (preferred for human operators) or user_id (UUID, for API clients).
      parameters:
      - description: User promotion request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.PromoteUserToSystemAdminRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User promoted successfully
          schema:
            $ref: '#/definitions/types.UserInfo'
        "400":
          description: Bad request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
      summary: Promote a user to system administrator
      tags:
      - System Admin
  /system/admin/revoke:
    post:
      consumes:
      - application/json
      description: |-
        Remove system administrator privileges from a user (SystemAdmin only).
        Two safety guards: the caller cannot revoke their own privileges,
        and revoking the last remaining system admin is rejected — both
        prevent a SystemAdmin from accidentally locking the platform out
        of system-level administration. Idempotent on already-non-admin users.
      parameters:
      - description: User revocation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.RevokeSystemAdminRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Privileges revoked successfully
          schema:
            $ref: '#/definitions/types.UserInfo'
        "400":
          description: Bad request / would remove last admin / self-revoke
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
      summary: Revoke system administrator privileges from a user
      tags:
      - System Admin
  /system/admin/runtime/queues:
    get:
      description: Return the live depth of each asynq queue (pending, active, scheduled,
        retry and so on) along with the worker concurrency configuration. Visible
        to system administrators only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.RuntimeQueuesResponse'
      summary: Get the runtime status of the parsing task queues
      tags:
      - System Admin
  /system/admin/runtime/queues/{queue}/archived:
    delete:
      parameters:
      - description: Queue name
        in: path
        name: queue
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Purge all archived tasks in a queue
      tags:
      - System Admin
  /system/admin/runtime/queues/{queue}/tasks:
    get:
      parameters:
      - description: Queue name
        in: path
        name: queue
        required: true
        type: string
      - description: Task state
        enum:
        - pending
        - active
        - scheduled
        - retry
        - archived
        - completed
        in: query
        name: state
        required: true
        type: string
      - description: Opaque continuation cursor
        in: query
        name: cursor
        type: string
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.RuntimeTasksResponse'
      summary: List runtime queue tasks by state
      tags:
      - System Admin
  /system/admin/runtime/queues/{queue}/tasks/{task_id}/actions/{action}:
    post:
      parameters:
      - description: Queue name
        in: path
        name: queue
        required: true
        type: string
      - description: Task ID
        in: path
        name: task_id
        required: true
        type: string
      - description: Action
        enum:
        - cancel
        - run_now
        - delete
        in: path
        name: action
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: Run a safe runtime task action
      tags:
      - System Admin
  /system/admin/settings/{key}:
    delete:
      description: |-
        Removes the DB override for :key so the 3-tier resolver
        falls back to the environment variable (when configured)
        or the in-code default. Idempotent — resetting a key
        that was never persisted returns 200.
      parameters:
      - description: Setting key
        in: path
        name: key
        required: true
        type: string
      responses:
        "200":
          description: Reset acknowledged
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Unknown key
          schema:
            additionalProperties: true
            type: object
        "500":
          description: DB write failed
          schema:
            additionalProperties: true
            type: object
      summary: Reset a system setting to ENV / built-in default
      tags:
      - System Admin
    get:
      description: |-
        Returns the row matching :key. 404 when the key is unknown
        to the registry; 200 with the row when known.
      parameters:
      - description: Setting key (e.g. file.max_size_mb)
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: the setting row
          schema:
            $ref: '#/definitions/types.SystemSetting'
        "400":
          description: Unknown key
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Key registered but DB row absent
          schema:
            additionalProperties: true
            type: object
      summary: Get a single system setting by key
      tags:
      - System Admin
    put:
      consumes:
      - application/json
      description: |-
        Persist a new value for :key. Service validates the
        rawValue against the registry's declared value_type and
        rejects mismatches with 400. SystemAdmin only. Emits an
        audit row (action=system.setting_changed) on success.
      parameters:
      - description: Setting key
        in: path
        name: key
        required: true
        type: string
      - description: New value
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateSystemSettingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: the updated row
          schema:
            $ref: '#/definitions/types.SystemSetting'
        "400":
          description: Bad request / unknown key / type mismatch
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
      summary: Update a system setting value
      tags:
      - System Admin
  /system/admin/tenants/apply-default-storage-quota:
    post:
      description: |-
        Reads the current value of `tenant.default_storage_quota_gb`
        (3-tier resolver: DB > ENV > default) and writes that many
        GiB into storage_quota for every row in tenants. Bypasses
        the per-workspace PUT whitelist, which forbids storage_quota
        edits by Owners. SystemAdmin only.
        Idempotent — running twice with the same setting is a no-op.
      produces:
      - application/json
      responses:
        "200":
          description: '{ affected: int64, quota_bytes: int64 }'
          schema:
            additionalProperties: true
            type: object
        "500":
          description: DB write failed
          schema:
            additionalProperties: true
            type: object
      summary: Apply the default storage quota to every existing workspace
      tags:
      - System Admin
  /system/admin/users/create:
    post:
      consumes:
      - application/json
      description: |-
        Provision a new local user account (SystemAdmin only).
        When `password` is omitted or null, a cryptographically random
        password is generated (OIDC-style crypto/rand + base64url)
        and returned once in the response body. Any provided value,
        including empty string, is policy-checked. Tenant provisioning
        follows the shared auth.default_tenant_mode policy.
      parameters:
      - description: User creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/types.AdminCreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Identity already exists, returns the existing user
          schema:
            $ref: '#/definitions/internal_handler.CreateSystemUserResponse'
        "201":
          description: User created successfully
          schema:
            $ref: '#/definitions/internal_handler.CreateSystemUserResponse'
        "400":
          description: Invalid request or weak password
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Email and username refer to conflicting identities
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal error
          schema:
            additionalProperties: true
            type: object
      summary: Create a new user (SystemAdmin)
      tags:
      - System Admin
  /system/admin/users/reset-password:
    post:
      consumes:
      - application/json
      description: |-
        Replace another user's local password and revoke all of their existing sessions (SystemAdmin only).
        A system administrator cannot reset their own password through this endpoint; self-service password change still requires the old password.
      parameters:
      - description: Password reset request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.ResetUserPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request, weak password, or self reset
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 'Forbidden: not a system admin'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties: true
            type: object
      summary: Reset another user's password
      tags:
      - System Admin
  /system/capabilities:
