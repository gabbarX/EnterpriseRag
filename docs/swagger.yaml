        type: integer
    required:
    - slug
    - version
    type: object
  types.WikiPageRevision:
    properties:
      aliases:
        items:
          type: string
        type: array
      content:
        type: string
      created_at:
        type: string
      edit_source:
        description: Author of THIS version (same semantics as WikiPage.LastEditSource).
        type: string
      edited_at:
        description: When this version was authored (the page's updated_at while current).
        type: string
      editor_id:
        type: string
      id:
        type: string
      knowledge_base_id:
        type: string
      page_id:
        type: string
      page_type:
        type: string
      slug:
        type: string
      status:
        type: string
      summary:
        type: string
      tenant_id:
        type: integer
      title:
        type: string
      version:
        type: integer
    type: object
  types.WikiPageRevisionListResponse:
    properties:
      current_version:
        type: integer
      revisions:
        items:
          $ref: '#/definitions/types.WikiPageRevision'
        type: array
      total:
        type: integer
    type: object
  types.WikiPageUpdateRequest:
    properties:
      aliases:
        items:
          type: string
        type: array
      content:
        type: string
      page_type:
        type: string
      status:
        type: string
      summary:
        type: string
      title:
        type: string
      version:
        description: |-
          Version is the optimistic-lock guard: when > 0 the update is rejected
          with a conflict if the stored version differs (someone else edited the
          page since the client loaded it). 0 skips the check (legacy clients).
        type: integer
    type: object
  types.WikiStats:
    properties:
      is_active:
        description: whether wiki ingestion is currently running
        type: boolean
      orphan_count:
        description: pages with no inbound links
        type: integer
      pages_by_type:
        additionalProperties:
          format: int64
          type: integer
        type: object
      pending_issues:
        description: number of pending wiki issues
        type: integer
      pending_tasks:
        description: number of documents waiting to be ingested
        type: integer
      recent_updates:
        description: last N updated pages
        items:
          $ref: '#/definitions/types.WikiPage'
        type: array
      total_links:
        type: integer
      total_pages:
        type: integer
    type: object
info:
  contact:
    name: EnterpriseRag Github
    url: https://github.com/ORG_PLACEHOLDER/EnterpriseRag
  description: EnterpriseRag knowledge base management system API documentation
  termsOfService: http://swagger.io/terms/
  title: EnterpriseRag API
  version: "1.0"
paths:
  /agent-chat/{session_id}:
    post:
      consumes:
      - application/json
      description: Agent-driven question answering, supporting multi-turn conversation
        and SSE streaming responses
      parameters:
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      - description: Question answering request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_session.CreateKnowledgeQARequest'
      - default: handle
        description: File reference form; public returns loadable direct links
        enum:
        - handle
        - public
        in: query
        name: resource_urls
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: Question answering result (SSE stream)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Agent question answering
      tags:
      - Chat
  /agent/mcp-oauth-resolutions/{pending_id}:
    post:
      consumes:
      - application/json
      description: Called after the user completes OAuth authorisation inside a conversation;
        verifies the token exists and then resumes the suspended agent tool call
      parameters:
      - description: Pending authorisation ID
        in: path
        name: pending_id
        required: true
        type: string
      - description: '{service_id: string}'
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.AppError'
        "409":
          description: User has not completed authorisation yet
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: Complete in-conversation MCP OAuth authorisation
      tags:
      - MCP Services
  /agent/mcp-oauth-resolutions/{pending_id}/cancel:
    post:
      description: The user explicitly skips OAuth authorisation, unblocking the agent
      parameters:
      - description: Pending authorisation ID
        in: path
        name: pending_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: Skip in-conversation MCP OAuth authorisation
      tags:
      - MCP Services
  /agent/tool-approvals/{pending_id}:
    post:
      consumes:
      - application/json
      description: The user approves or rejects one tool call (for scenarios where
        the agent is blocked waiting for approval)
      parameters:
      - description: Pending approval record ID
        in: path
        name: pending_id
        required: true
        type: string
      - description: '{decision: \'
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Approval result
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: Pending approval record not found
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Handle a pending MCP tool call approval request
      tags:
      - MCP Services
  /agents:
    get:
      consumes:
      - application/json
      description: List all agents in the current space, including built-in agents
      produces:
      - application/json
      responses:
        "200":
          description: Agent list
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: List agents
      tags:
      - Agents
    post:
      consumes:
      - application/json
      description: Create a new custom agent
      parameters:
      - description: Agent details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.CreateAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created agent
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Create an agent
      tags:
      - Agents
  /agents/{id}:
    delete:
      consumes:
      - application/json
      description: Delete the specified agent
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deleted successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/errors.AppError'
        "403":
          description: Built-in agents cannot be deleted
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: Agent not found
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Delete an agent
      tags:
      - Agents
    get:
      consumes:
      - application/json
      description: Get agent details by ID
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Agent details
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: Agent not found
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get agent details
      tags:
      - Agents
    put:
      consumes:
      - application/json
      description: Update the name, description and configuration of an agent
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      - description: Update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated agent
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/errors.AppError'
        "403":
          description: Built-in agents cannot be modified
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Update an agent
      tags:
      - Agents
  /agents/{id}/copy:
    post:
      consumes:
      - application/json
      description: Duplicate the specified agent
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Duplicated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: Agent not found
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Duplicate an agent
      tags:
      - Agents
  /agents/{id}/shares/{share_id}:
    delete:
      description: Remove the given share from an agent's sharing list
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      - description: Share record ID
        in: path
        name: share_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'success: true'
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Not permitted
          schema:
            $ref: '#/definitions/github_com_ORG_PLACEHOLDER_EnterpriseRag_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Revoke an agent share
      tags:
      - Organizations
  /agents/{id}/suggested-questions:
    get:
      consumes:
      - application/json
      description: Returns suggested questions based on the knowledge bases linked
        to the agent, for quick user prompts
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      - description: Comma-separated list of knowledge base IDs, overriding the default
          agent configuration
        in: query
        name: knowledge_base_ids
        type: string
      - description: Comma-separated list of knowledge IDs, restricting to specific
          documents
        in: query
        name: knowledge_ids
        type: string
      - description: Tag scopes with knowledge base ownership (JSON)
        in: query
        name: tag_scopes
        type: string
      - description: Maximum number of results (defaults to the opening question count
          configured on the agent, maximum 30)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Suggested question list
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/errors.AppError'
        "404":
          description: Agent not found
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get suggested questions
      tags:
      - Agents
  /agents/placeholders:
    get:
      consumes:
      - application/json
      description: Get all available prompt placeholder definitions, grouped by field
        type
      produces:
      - application/json
      responses:
        "200":
          description: Placeholder definitions
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get placeholder definitions
      tags:
      - Agents
  /agents/type-presets:
    get:
      consumes:
      - application/json
      description: Returns all agent type presets available under smart-reasoning
        (RAG/Wiki/Hybrid/Custom), used by the editor to auto-fill the system prompt,
        tools and KB compatibility
      produces:
      - application/json
      responses:
        "200":
          description: Preset list
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: List agent type presets
      tags:
      - Agents
  /api/v1/knowledge/{id}/spans:
    get:
      consumes:
      - application/json
      description: 'Returns the trace tree of this knowledge entry in the parsing
        pipeline (root to stage to subspan): the status, duration, input/output, error
        code and langfuse_trace_id of each span. Supports ?attempt=N to view a past
        attempt; the latest attempt is returned when omitted. The frontend uses it
        to render the timeline, the multimodal and embedding child nodes, and a one-click
        jump to Langfuse.'
      parameters:
      - description: Knowledge ID
        in: path
        name: id
        required: true
        type: string
      - description: Attempt number; omit for the latest
        in: query
        name: attempt
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get the span tree for knowledge document parsing (including past attempts)
      tags:
      - Knowledge Management
  /artifacts:
