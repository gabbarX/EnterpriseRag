          $ref: '#/definitions/github_com_ORG_PLACEHOLDER_EnterpriseRag_internal_models_limiter.RuntimeStat'
        type: array
      parse_concurrency:
        description: compatibility alias for upstream_concurrency
        type: integer
      pools:
        items:
          $ref: '#/definitions/internal_handler.RuntimeWorkerPool'
        type: array
      queues:
        items:
          $ref: '#/definitions/types.QueueStat'
        type: array
      timestamp:
        type: integer
      upstream_concurrency:
        type: integer
      wiki_concurrency:
        description: compatibility field
        type: integer
