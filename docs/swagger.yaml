          to the latest)'
        in: query
        name: after_id
        type: integer
      - description: Page size, 1-100, default 50
        in: query
        name: limit
        type: integer
      - description: Exact filter on action (for example rbac.member_added / rbac.access_denied)
        in: query
        name: action
        type: string
      - description: Exact filter on outcome (success / denied)
        in: query
        name: outcome
        type: string
      - description: Exact filter on actor_user_id
        in: query
        name: actor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.auditLogListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get space audit logs
      tags:
      - Audit Logs
  /tenants/{id}/invitations:
    get:
      description: List the pending and historical invitations of a workspace. With
        include_terminal=true, accepted/declined/revoked/expired rows are included
        as well.
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Whether to include terminal-state rows (default false)
        in: query
        name: include_terminal
        type: boolean
      - default: 1
        description: Page number (starting at 1)
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: List workspace invitations
      tags:
      - Workspace Invitations
    post:
      consumes:
      - application/json
      description: An owner invites a registered user to the workspace by email. With
        tenant.auto_accept_invitation enabled the invitee joins immediately (the response
        is a member object); otherwise they must accept it at /me/invitations to become
        a member.
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Invitation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createInvitationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Send a workspace invitation
      tags:
      - Workspace Invitations
  /tenants/{id}/invitations/{inv_id}:
    delete:
      description: An owner cancels an invitation that is still pending. Rows already
        accepted, declined, revoked or expired cannot be revoked.
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Invitation ID
        in: path
        name: inv_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Revoke a pending invitation
      tags:
      - Workspace Invitations
  /tenants/{id}/invite-links:
    post:
      consumes:
      - application/json
      description: |-
        Create a reusable shared invite link: anyone who receives the link can register and join the current workspace.
        The link stays valid until it expires or is revoked.
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Shared link configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createInviteLinkRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Create a shared invite link
      tags:
      - Workspace Invitations
  /tenants/{id}/leave:
    post:
      description: The caller leaves the current workspace. Equivalent to calling
        RemoveMember with
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Leave the current workspace
      tags:
      - Workspace Members
  /tenants/{id}/members:
    get:
      description: Return the active members of the current workspace page by page,
        including each member's role, email and avatar. Use q to filter by email or
        username.
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Fuzzy filter by email or username
        in: query
        name: q
        type: string
      - default: 1
        description: Page number (starting at 1)
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page (max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: List workspace members
      tags:
      - Workspace Members
    post:
      consumes:
      - application/json
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Invitation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.addMemberRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Add a workspace member directly (direct-add path)
      tags:
      - Workspace Members
  /tenants/{id}/members/{user_id}:
    delete:
      description: An owner removes a member from the current workspace (soft-deleting
        the tenant_members row). The last remaining owner cannot be removed.
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Remove a workspace member
      tags:
      - Workspace Members
    put:
      consumes:
      - application/json
      description: An owner changes a member's role within the current workspace.
        The last remaining owner cannot be demoted.
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      - description: Target role
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.updateMemberRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Change a workspace member's role
      tags:
      - Workspace Members
  /tenants/all:
    get:
      consumes:
      - application/json
      description: List every workspace in the system (requires cross-workspace access)
      produces:
      - application/json
      responses:
        "200":
          description: List of all workspaces
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Insufficient permissions
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      summary: List all workspaces
      tags:
      - Workspaces
  /tenants/kv/{key}:
    get:
      consumes:
      - application/json
      description: 'Get a workspace-level KV setting (supported keys: web-search-config,
        prompt-templates, parser-engine-config, storage-engine-config, chat-history-config,
        retrieval-config)'
      parameters:
      - description: Setting key
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Setting value
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Unsupported key
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get a workspace KV setting
      tags:
      - Workspaces
    put:
      consumes:
      - application/json
      description: 'Update a workspace-level KV setting (supported keys: web-search-config,
        parser-engine-config, storage-engine-config, chat-history-config, retrieval-config)'
      parameters:
      - description: Setting key
        in: path
        name: key
        required: true
        type: string
      - description: Setting value
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Unsupported key
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Update a workspace KV setting
      tags:
      - Workspaces
  /tenants/kv/prompt-templates:
    get:
      consumes:
      - application/json
      description: Get the list of prompt templates configured in the system
      produces:
      - application/json
      responses:
        "200":
          description: Prompt template configuration
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get prompt templates
      tags:
      - Workspaces
  /tenants/kv/web-search-config:
    get:
      consumes:
      - application/json
      description: Get the web search configuration of the workspace
      produces:
      - application/json
      responses:
        "200":
          description: Web search configuration
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get the workspace web search configuration
      tags:
      - Workspaces
  /tenants/search:
    get:
      consumes:
      - application/json
      description: Search workspaces page by page (requires cross-workspace access)
      parameters:
      - description: Search keyword
        in: query
        name: keyword
        type: string
      - description: Filter by workspace ID
        in: query
        name: tenant_id
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Search results
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Insufficient permissions
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Search workspaces
      tags:
      - Workspaces
  /user/favorites:
    get:
      description: Lists this user's starred resources in the current workspace for
        a given type
      parameters:
      - description: Resource type (kb | agent)
        in: query
        name: type
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List my favorites
      tags:
      - User
    post:
      parameters:
      - description: Type + id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.AddFavoriteRequest'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Star a resource
      tags:
      - User
  /user/favorites/{type}/{id}:
    delete:
      parameters:
      - description: Resource type
        in: path
        name: type
        required: true
        type: string
      - description: Resource id
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Unstar a resource
      tags:
      - User
  /vector-stores:
    get:
      description: List all vector stores for the current workspace, including environment-configured
        and user-created stores
      produces:
      - application/json
      responses:
        "200":
          description: List of vector stores (env + DB)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: List vector stores
      tags:
      - VectorStore
    post:
      consumes:
      - application/json
      description: Create a new vector store configuration for the current workspace
      parameters:
      - description: Vector store configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.CreateStoreRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created vector store
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/errors.AppError'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Duplicate endpoint and index
          schema:
            $ref: '#/definitions/errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Create vector store
      tags:
      - VectorStore
  /vector-stores/{id}:
    delete:
      description: Soft-delete a vector store. Env stores cannot be deleted.
      parameters:
      - description: Vector store ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deletion success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Env store cannot be deleted
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Vector store not found
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Delete vector store
      tags:
      - VectorStore
    get:
      description: Retrieve a single vector store by ID. Supports both DB stores and
        env stores (__env_* IDs)
      parameters:
      - description: Vector store ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Vector store details
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Vector store not found
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get vector store
      tags:
      - VectorStore
    put:
      consumes:
      - application/json
      description: Update a vector store (name only). Engine type, connection config,
        and index config are immutable. Env stores cannot be modified.
      parameters:
      - description: Vector store ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateStoreRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated vector store
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Env store or validation error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Vector store not found
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Update vector store
      tags:
      - VectorStore
  /vector-stores/{id}/test:
    post:
      description: Test connectivity of an existing saved or env store. Returns detected
        server version. For DB stores, the version is automatically saved to connection_config.
      parameters:
      - description: Vector store ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Connection test result (success, version)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Vector store not found
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Test vector store connection by ID
      tags:
      - VectorStore
  /vector-stores/test:
    post:
      consumes:
      - application/json
      description: Test connectivity using provided credentials without persisting.
        Returns detected server version.
      parameters:
      - description: Engine type and connection config
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.TestStoreRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Connection test result (success, version)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/errors.AppError'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Test vector store connection with raw credentials
      tags:
      - VectorStore
  /vector-stores/types:
    get:
      description: Return supported engine types with connection and index field schemas
        for UI form generation
      produces:
      - application/json
      responses:
        "200":
          description: List of engine types with config schemas
          schema:
            additionalProperties: true
            type: object
      summary: List vector store types
      tags:
      - VectorStore
  /web-search-providers/{id}:
    delete:
      description: Delete the configuration of a provider
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'success: true'
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Provider not found
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Delete a web search provider
      tags:
      - Web Search
    get:
      description: Get the configuration of a provider by ID
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Provider details
          schema:
            $ref: '#/definitions/types.WebSearchProviderEntity'
        "404":
          description: Provider not found
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get web search provider details
      tags:
      - Web Search
    put:
      consumes:
      - application/json
      description: Update a provider's name, description, parameters or default flag
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateProviderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated provider
          schema:
            $ref: '#/definitions/types.WebSearchProviderEntity'
        "400":
          description: Invalid request parameters
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Provider not found
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Update a web search provider
      tags:
      - Web Search
  /web-search-providers/{id}/test:
    post:
      description: Test connectivity using the credentials already stored in the database
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Test result
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Provider not found
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Test a saved provider
      tags:
      - Web Search
  /web-search-providers/test:
    post:
      consumes:
      - application/json
      description: Test connectivity using credentials that are still unsaved in the
        frontend form; backs the Test Connection button
      parameters:
      - description: '{provider, parameters}'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.TestProviderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Test result
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request parameters
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Test a provider with raw credentials (not persisted)
      tags:
      - Web Search
  /web-search-providers/types:
    get:
      description: Return the provider types and parameter definitions required by
        the UI form
      produces:
      - application/json
      responses:
        "200":
          description: Provider type list
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Get web search provider type metadata
      tags:
      - Web Search
  /web-search/providers:
    get:
      description: Return every registered web search provider along with its metadata
      produces:
      - application/json
      responses:
        "200":
          description: Provider list
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: List available web search providers
      tags:
      - Web Search
securityDefinitions:
  ApiKeyAuth:
    description: 'API key authentication: a space key is fixed to its own space; a
      platform key calling a space endpoint must also send X-Tenant-ID'
    in: header
    name: X-API-Key
    type: apiKey
  Bearer:
    description: 'User login authentication: supply a JWT token in the form Bearer
      {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
