      description: |-
        Completes registration using a shared invitation link token generated by an Owner, bypassing the invite_only mode check.
        The registrant supplies their own email address (not bound to the token); on success they automatically join the corresponding space.
      parameters:
      - description: Invitation registration request
        in: body
        name: request
        required: true
